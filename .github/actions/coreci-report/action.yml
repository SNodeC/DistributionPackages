name: Report to core-ci
description: Sign and send a workflow callback; an empty URL disables reporting.
inputs:
  callback_url:
    description: Complete percent-encoded callback URL
    required: true
  phase:
    description: build or publish
    required: true
  status:
    description: started, succeeded or failed
    required: true
  artifact:
    description: Uploaded artifact name
    default: ''
  feed_commit:
    description: Published feed commit
    default: ''
  reason:
    description: Failure reason
    default: ''
runs:
  using: composite
  steps:
    - name: Sign and report
      if: inputs.callback_url != ''
      shell: bash
      env:
        CALLBACK_URL: ${{ inputs.callback_url }}
        REPORT_PHASE: ${{ inputs.phase }}
        REPORT_STATUS: ${{ inputs.status }}
        REPORT_ARTIFACT: ${{ inputs.artifact }}
        REPORT_FEED_COMMIT: ${{ inputs.feed_commit }}
        REPORT_REASON: ${{ inputs.reason }}
      run: |
        set -euo pipefail
        test -n "${CORECI_CALLBACK_SECRET:-}"
        body=$(python3 - <<'PY'
        import os
        from urllib.parse import urlencode
        reason = os.environ['REPORT_REASON'].encode()[:1000].decode('utf-8', 'ignore')
        fields = dict(phase=os.environ['REPORT_PHASE'], status=os.environ['REPORT_STATUS'],
                      run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                      artifact=os.environ['REPORT_ARTIFACT'], feed_commit=os.environ['REPORT_FEED_COMMIT'], reason=reason)
        print(urlencode(fields), end='')
        PY
        )
        timestamp=$(date +%s)
        signature=$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CORECI_CALLBACK_SECRET" -r)
        signature=${signature%% *}
        curl --fail --silent --show-error --retry 5 --retry-all-errors \
          --header 'Content-Type: application/x-www-form-urlencoded' \
          --header "X-CoreCI-Timestamp: $timestamp" \
          --header "X-CoreCI-Signature-256: sha256=$signature" \
          --data-raw "$body" "$CALLBACK_URL"
