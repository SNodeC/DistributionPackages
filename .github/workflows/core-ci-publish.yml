name: core-ci trusted publication
run-name: Publish ${{ fromJSON(inputs.assignment).label }}
on:
  workflow_dispatch:
    inputs:
      execution:
        required: true
        type: string
      attempt:
        required: true
        type: string
      assignment_sha256:
        required: true
        type: string
      assignment:
        required: true
        type: string
      build_result:
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  CORE_CI_TOOLING_SHA: "f59e9ea15428d7667613d2388b1109ca7f5fa2f5"
  CONTROLLER_APP_BOT_ID: ${{ vars.CONTROLLER_APP_BOT_ID }}
  FEED_REPOSITORY: ${{ vars.FEED_REPOSITORY }}
  FEED_REPOSITORY_ID: ${{ vars.FEED_REPOSITORY_ID }}
  FEED_BRANCH: ${{ vars.FEED_BRANCH }}
  FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
  PACKAGES_GPG_FINGERPRINT: ${{ vars.PACKAGES_GPG_FINGERPRINT }}
  OPENWRT_DOWNLOAD_BASE_URL: ${{ vars.OPENWRT_DOWNLOAD_BASE_URL || 'https://downloads.openwrt.org' }}
  EXECUTION: ${{ inputs.execution }}
  ATTEMPT: ${{ inputs.attempt }}
  ASSIGNMENT: ${{ inputs.assignment }}
  ASSIGNMENT_SHA256: ${{ inputs.assignment_sha256 }}
  BUILD_RESULT: ${{ inputs.build_result }}
jobs:
  validate:
    if: fromJSON(inputs.assignment).kind != 'retention'
    name: Validate the assigned build artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.validated.outputs.artifact-id }}
      environment: ${{ steps.validation.outputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CORE_CI_TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - name: Mint read-only source artifact access
        id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.BUILD_READER_APP_ID }}
          private-key: ${{ secrets.PACKAGE_CAPTURE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BUILD_READER_REPOSITORIES }}
          permission-actions: read
          permission-contents: read
      - name: Validate provenance, archive and actual package metadata
        id: validation
        env:
          SOURCE_ARTIFACT_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/validated"
          printf '%s' "$ASSIGNMENT" > "$RUNNER_TEMP/assignment.json"
          printf '%s' "$BUILD_RESULT" > "$RUNNER_TEMP/build-result.json"
          python3 tooling/core_ci/validate.py \
            --assignment "$RUNNER_TEMP/assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" \
            --build-result "$RUNNER_TEMP/build-result.json" \
            --output "$RUNNER_TEMP/validated/packages"
      - id: validated
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ fromJSON(inputs.assignment).artifact_name }}-validated
          path: ${{ runner.temp }}/validated/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  tools:
    name: Extract verified OpenWrt publication tools
    needs: validate
    if: >-
      !cancelled() && fromJSON(inputs.assignment).target.family == 'openwrt' &&
      (needs.validate.result == 'success' || (fromJSON(inputs.assignment).kind == 'retention' && needs.validate.result == 'skipped')) &&
      (fromJSON(inputs.assignment).kind != 'retention' || contains(join(fromJSON(inputs.assignment).objects.*.path, ' '), 'openwrt/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.tools.outputs.artifact-id }}
      tools-sha256: ${{ steps.extracted.outputs.tools-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CORE_CI_TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - name: Prepare verified publication tools
        id: extracted
        env:
          CORE_CI_SDK_ENVIRONMENT: ${{ needs.validate.outputs.environment }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASSIGNMENT" > "$RUNNER_TEMP/assignment.json"
          python3 tooling/core_ci/sdk.py --assignment "$RUNNER_TEMP/assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" --output "$RUNNER_TEMP/tools"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: tools
        with:
          name: ${{ fromJSON(inputs.assignment).artifact_name }}-tools
          path: ${{ runner.temp }}/tools/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  publish:
    name: Publish ${{ fromJSON(inputs.assignment).label }}
    needs: [validate, tools]
    if: ${{ !cancelled() }}
    env:
      PUBLICATION_INPUTS_OK: >-
        ${{ (needs.validate.result == 'success' ||
         (fromJSON(inputs.assignment).kind == 'retention' && needs.validate.result == 'skipped')) &&
        ((fromJSON(inputs.assignment).target.family == 'openwrt' && (needs.tools.result == 'success' ||
          (fromJSON(inputs.assignment).kind == 'retention' && needs.tools.result == 'skipped' &&
           !contains(join(fromJSON(inputs.assignment).objects.*.path, ' '), 'openwrt/')))) ||
         (fromJSON(inputs.assignment).target.family == 'native' && needs.tools.result == 'skipped')) }}
    concurrency:
      group: core-ci-feed-${{ vars.FEED_REPOSITORY }}-${{ vars.FEED_BRANCH }}
      cancel-in-progress: false
      queue: max
    outputs:
      receipt-sha256: ${{ steps.prepared.outputs.receipt-sha256 }}
      feed-revision: ${{ steps.prepared.outputs.feed-revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: package-publication
    steps:
      - name: Require validated publication inputs
        if: env.PUBLICATION_INPUTS_OK != 'true'
        run: |
          echo '::error::Publication inputs failed validation; no feed mutation attempted'
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CORE_CI_TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.FEED_REPOSITORY }}
          ref: ${{ vars.FEED_BRANCH }}
          path: feed
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: fromJSON(inputs.assignment).kind != 'retention'
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/validated
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.tools.result == 'success'
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact-id }}
          path: ${{ runner.temp }}/tools
          merge-multiple: true
      - name: Install RPM repository tools
        if: >-
          fromJSON(inputs.assignment).target.build.format == 'rpm' &&
          (fromJSON(inputs.assignment).kind != 'retention' ||
           contains(format(' {0}', join(fromJSON(inputs.assignment).objects.*.path, ' ')),
                    format(' {0}/', fromJSON(inputs.assignment).target.distribution)))
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c
      - name: Install pinned template dependencies
        run: |
          python3 -m venv --without-pip "$RUNNER_TEMP/core-ci-status-python"
          python3 -m pip --python "$RUNNER_TEMP/core-ci-status-python/bin/python" install -r tooling/status-templates/requirements.txt
      - name: Prepare signed feed update
        id: prepared
        env:
          CORE_CI_TOOLS_SHA256: ${{ needs.tools.outputs.tools-sha256 }}
          PUBLICATION_PHASE: ${{ fromJSON(inputs.assignment).kind == 'retention' && 'retain' || 'prepare' }}
          CORE_CI_RENDER_PYTHON: ${{ runner.temp }}/core-ci-status-python/bin/python
          GITHUB_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: >-
            ${{ (fromJSON(inputs.assignment).target.build.format == 'deb' || fromJSON(inputs.assignment).target.build.format == 'rpm')
            && secrets.APT_SIGNING_KEY || '' }}
          OPENWRT_USIGN_KEY: ${{ fromJSON(inputs.assignment).target.build.format == 'ipk' && secrets.OPENWRT_USIGN_KEY || '' }}
          OPENWRT_APK_KEY: ${{ fromJSON(inputs.assignment).target.build.format == 'apk' && secrets.OPENWRT_APK_KEY || '' }}
          PACKAGES_GPG_PASSPHRASE: >-
            ${{ (fromJSON(inputs.assignment).target.build.format == 'deb' || fromJSON(inputs.assignment).target.build.format == 'rpm')
            && secrets.PACKAGES_GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASSIGNMENT" > "$RUNNER_TEMP/assignment.json"
          printf '%s' "$BUILD_RESULT" > "$RUNNER_TEMP/build-result.json"
          python3 tooling/core_ci/publish.py --phase "$PUBLICATION_PHASE" \
            --assignment "$RUNNER_TEMP/assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" \
            --build-result "$RUNNER_TEMP/build-result.json" \
            --artifacts "$RUNNER_TEMP/validated/packages" \
            --tools "$RUNNER_TEMP/tools" \
            --feed "$GITHUB_WORKSPACE/feed"
      - name: Publish checked feed update
        env:
          EXPECTED_FEED_HEAD: ${{ steps.prepared.outputs.expected-head }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES_APP_PRIVATE_KEY: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          FEED_WRITER_APP_ID: ${{ vars.FEED_WRITER_APP_ID }}
          FEED_WRITER_INSTALLATION_ID: ${{ vars.FEED_WRITER_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 tooling/core_ci/publish.py --phase push \
            --expected-head "$EXPECTED_FEED_HEAD" \
            --assignment "$RUNNER_TEMP/assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" \
            --build-result "$RUNNER_TEMP/build-result.json" \
            --artifacts "$RUNNER_TEMP/validated/packages" \
            --feed "$GITHUB_WORKSPACE/feed"
  confirm:
    if: ${{ !cancelled() && needs.publish.result == 'success' && fromJSON(inputs.assignment).kind != 'retention' }}
    name: Confirm public receipt
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CORE_CI_TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - name: Verify the exact prepared receipt over HTTPS
        env:
          RECEIPT_SHA256: ${{ needs.publish.outputs.receipt-sha256 }}
          FEED_REVISION: ${{ needs.publish.outputs.feed-revision }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASSIGNMENT" > "$RUNNER_TEMP/assignment.json"
          python3 tooling/core_ci/publish.py --phase confirm \
            --assignment "$RUNNER_TEMP/assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" \
            --receipt-sha256 "$RECEIPT_SHA256" \
            --feed-revision "$FEED_REVISION"
