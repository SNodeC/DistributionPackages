name: core-ci reusable build
on:
  workflow_call:
    inputs:
      execution:
        required: true
        type: string
      attempt:
        required: true
        type: string
      assignment_sha256:
        required: true
        type: string
      assignment:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  package:
    name: Build ${{ fromJSON(inputs.assignment).label }}
    runs-on: ${{ fromJSON(inputs.assignment).target.runner }}
    timeout-minutes: 80
    steps:
      - name: Check out trusted tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ fromJSON(inputs.assignment).source.deployment.worker.repository }}
          ref: ${{ fromJSON(inputs.assignment).source.deployment.worker.tooling_sha }}
          path: tooling
          persist-credentials: false
      - name: Check out selected source, independently of workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ fromJSON(inputs.assignment).source.commit }}
          path: source
          persist-credentials: false
      - name: Check out selected CI revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ fromJSON(inputs.assignment).source.definition_revision }}
          path: definition
          persist-credentials: false
      - name: Install SDK inspection prerequisites
        if: ${{ fromJSON(inputs.assignment).target.family == 'openwrt' }}
        run: sudo apt-get update && sudo apt-get install -y zstd make
      - name: Authenticate pinned Raspberry Pi OS environment reader
        if: ${{ fromJSON(inputs.assignment).target.distribution == 'raspberrypios' }}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Enable foreign-architecture execution
        if: ${{ fromJSON(inputs.assignment).target.build.platform == 'linux/arm/v7' || fromJSON(inputs.assignment).target.build.platform == 'linux/riscv64' }}
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
      - name: Resolve build environment on GitHub
        env:
          ASSIGNMENT: ${{ inputs.assignment }}
          ASSIGNMENT_SHA256: ${{ inputs.assignment_sha256 }}
          EXECUTION: ${{ inputs.execution }}
          ATTEMPT: ${{ inputs.attempt }}
          OPENWRT_WORKER_IMAGE: ${{ vars.OPENWRT_WORKER_IMAGE || 'ubuntu:24.04' }}
          OPENWRT_WORKER_PLATFORM: ${{ vars.OPENWRT_WORKER_PLATFORM || 'linux/amd64' }}
          OPENWRT_DOWNLOAD_BASE_URL: ${{ vars.OPENWRT_DOWNLOAD_BASE_URL || 'https://downloads.openwrt.org' }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASSIGNMENT" > "$RUNNER_TEMP/core-ci-assignment.json"
          mkdir "$RUNNER_TEMP/core-ci-environment"
          python3 tooling/core_ci/environment.py \
            --assignment "$RUNNER_TEMP/core-ci-assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" \
            --output "$RUNNER_TEMP/core-ci-environment/environment.json"
      - name: Record resolved build environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ fromJSON(inputs.assignment).artifact_name }}-environment
          path: ${{ runner.temp }}/core-ci-environment/environment.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Build selected packages in an isolated container
        env:
          ASSIGNMENT_SHA256: ${{ inputs.assignment_sha256 }}
          EXECUTION: ${{ inputs.execution }}
          ATTEMPT: ${{ inputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tooling/core_ci/build.py \
            --assignment "$RUNNER_TEMP/core-ci-assignment.json" \
            --assignment-sha256 "$ASSIGNMENT_SHA256" \
            --environment "$RUNNER_TEMP/core-ci-environment/environment.json" \
            --source "$GITHUB_WORKSPACE/source" \
            --definition "$GITHUB_WORKSPACE/definition" \
            --output "$RUNNER_TEMP/core-ci-output"
      - name: Upload only the validated package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ fromJSON(inputs.assignment).artifact_name }}
          path: ${{ runner.temp }}/core-ci-output/*
          if-no-files-found: error
          overwrite: false
          retention-days: 30
