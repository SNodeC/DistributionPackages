name: Capture package release
on:
  workflow_call:
    inputs:
      release_project:
        type: string
      release_tag:
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  prepare:
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check release configuration
        env:
          PACKAGES_APP_CLIENT_ID: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          PACKAGES_APP_PRIVATE_KEY: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
        run: |
          for name in PACKAGES_APP_CLIENT_ID PACKAGES_APP_PRIVATE_KEY APT_SIGNING_KEY OPENWRT_APK_KEY OPENWRT_USIGN_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing CI configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v6
        if: github.run_attempt == 1
        with:
          ref: main
          path: feed
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        if: github.run_attempt == 1
        id: allocator
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        if: github.run_attempt == 1
        with:
          repository: SNodeC/Packages
          ref: main
          path: published
          token: ${{ steps.allocator.outputs.token }}
          sparse-checkout: |
            **/build.json
            /status.json
          sparse-checkout-cone-mode: false
      - name: Reserve independent project revisions
        if: github.run_attempt == 1
        env:
          RELEASE_PROJECT: ${{ inputs.release_project }}
        run: |
          previous=$(git -C published rev-parse HEAD)
          python3 -m ci.publish.publication reserve published
          bash feed/ci/publish/push.sh published "$previous" "Reserve package revisions" python3 -m ci.publish.publication reserve published
      - name: Reuse original capture (if missing, start a new run)
        if: github.run_attempt > 1
        uses: actions/download-artifact@v8
        with:
          name: source-pair
          path: bundle
      - name: Unpack original capture tools
        if: github.run_attempt > 1
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
      - name: Capture the source pair and full matrix
        if: github.run_attempt == 1
        env:
          RELEASE_PROJECT: ${{ inputs.release_project }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RECIPE_REF: main
        run: |
          export RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          python3 -m ci.repository prepare published bundle
      - uses: actions/upload-artifact@v7
        if: github.run_attempt == 1
        with:
          name: source-pair
          path: bundle/
          if-no-files-found: error
      - uses: actions/create-github-app-token@v3
        id: dispatch
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages,snode.c,mqttsuite
          permission-contents: write
          permission-actions: read
      - name: Initialize pending status
        continue-on-error: true
        timeout-minutes: 3
        env:
          PACKAGES_TOKEN: ${{ steps.dispatch.outputs.token }}
          BUILD_ATTEMPT: 1
        run: bash feed/ci/publish/status.sh status-checkout status bundle - - pending
      - name: Dispatch the upstream build matrix
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
          BUILD_PROJECT: ${{ inputs.release_project }}
        run: python3 -m ci.dispatch build bundle "$BUILD_PROJECT"
