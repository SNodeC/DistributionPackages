name: Unified distribution packages
on:
  workflow_call:
    inputs:
      release_project:
        type: string
      release_tag:
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      revisions: ${{ steps.matrix.outputs.revisions }}
    steps:
      - name: Check release configuration
        env:
          PACKAGES_APP_ID: ${{ vars.PACKAGES_APP_ID }}
          PACKAGES_APP_PRIVATE_KEY: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          PACKAGE_REVISION_BASE: ${{ vars.PACKAGE_REVISION_BASE }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
        run: |
          for name in PACKAGES_APP_ID PACKAGES_APP_PRIVATE_KEY PACKAGE_REVISION_BASE APT_SIGNING_KEY OPENWRT_APK_KEY OPENWRT_USIGN_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing CI configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v6
        with:
          ref: main
          path: feed
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          path: published
          sparse-checkout: '**/build.json'
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Capture the source pair and full matrix
        id: matrix
        env:
          RELEASE_PROJECT: ${{ inputs.release_project }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_REVISION_BASE: ${{ vars.PACKAGE_REVISION_BASE }}
          RECIPE_REF: main
        run: |
          export RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          python3 -m ci.repository prepare published bundle
          echo "revisions=$(jq -c . bundle/revisions.json)" >> "$GITHUB_OUTPUT"
          python3 -m ci.publish.publication matrix > matrix.json
          echo "value=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: source-pair
          path: bundle/
          if-no-files-found: error
          overwrite: true
  target:
    name: ${{ matrix.distribution }} · ${{ matrix.suite }} · ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/package-target.yml
    with:
      target: ${{ toJSON(matrix) }}
      revisions: ${{ needs.prepare.outputs.revisions }}
      release_project: ${{ inputs.release_project }}
    secrets: inherit
