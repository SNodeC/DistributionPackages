name: coreci status
on:
  workflow_dispatch:
    inputs:
      feed:
        required: true
        type: string
      generation:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  INPUT_FEED: ${{ inputs.feed }}
  INPUT_GENERATION: ${{ inputs.generation }}
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      owner: ${{ steps.resolve.outputs.owner }}
      repository_name: ${{ steps.resolve.outputs.repository_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install renderer dependency
        run: python3 -m pip install --user -r status-templates/requirements.txt
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m coreci.presentation resolve
  status:
    needs: resolve
    environment: ${{ needs.resolve.outputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install renderer dependency
        run: python3 -m pip install --user -r status-templates/requirements.txt
      - id: writer
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FEED_WRITER_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve.outputs.owner }}
          repositories: ${{ needs.resolve.outputs.repository_name }}
          permission-contents: write
      - name: Render and publish presentation only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 -m coreci.presentation run
