name: Prepare pinned Raspberry Pi OS build images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        suite: [bookworm, trixie]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate registry writer
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Prepare official checksum-pinned image
        run: python3 core_ci/rootfs_image.py --suite '${{ matrix.suite }}'
