# One workflow. Shared steps run on each project job's own runner.
name: Distribution packages
on:
  repository_dispatch:
    types:
      - release-tag-changed
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
  RELEASE_PROJECT: ${{ github.event.client_payload.repository == 'SNodeC/snode.c' && 'snode.c' || 'mqttsuite' }}
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      revisions: ${{ steps.matrix.outputs.revisions }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Check release configuration
        env:
          PACKAGES_APP_ID: ${{ vars.PACKAGES_APP_ID }}
          PACKAGES_APP_PRIVATE_KEY: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
        run: |
          for name in PACKAGES_APP_ID PACKAGES_APP_PRIVATE_KEY APT_SIGNING_KEY OPENWRT_APK_KEY OPENWRT_USIGN_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing CI configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v6
        if: github.run_attempt == 1
        with:
          ref: ${{ github.sha }}
          path: feed
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: allocator
        with:
          app-id: ${{ vars.PACKAGES_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          path: published
          token: ${{ steps.allocator.outputs.token }}
          sparse-checkout: |
            **/build.json
            /status.json
            /status/
            /docs/status.md
          sparse-checkout-cone-mode: false
      - name: Reserve independent project revisions
        if: github.run_attempt == 1
        env:
          RELEASE_PROJECT: ${{ env.RELEASE_PROJECT }}
        run: |
          bash feed/ci/publish/push.sh published "Reserve package revisions" python3 -m ci.publish.publication reserve published
      - name: Reuse original capture (if missing, start a new run)
        if: github.run_attempt > 1
        uses: actions/download-artifact@v8
        with:
          name: source-pair
          path: bundle
      - name: Capture the source pair and full matrix
        if: github.run_attempt == 1
        env:
          RELEASE_PROJECT: ${{ env.RELEASE_PROJECT }}
          RELEASE_TAG: ${{ github.event.client_payload.ref }}
          RECIPE_REF: main
        run: |
          export RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          python3 -m ci.repository prepare published bundle
      - uses: actions/upload-artifact@v7
        if: github.run_attempt == 1
        with:
          name: source-pair
          path: bundle/
          if-no-files-found: error
      - name: Publish pending status before starting builds
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            mkdir feed
            tar -xzf bundle/feed.tar.gz -C feed
          fi
          bash feed/ci/publish/push.sh published "Initialize package status" python3 -m ci.publish.publication start published bundle
      - name: Read the captured matrix and revisions
        id: matrix
        run: |
          echo "revisions=$(jq -c . bundle/revisions.json)" >> "$GITHUB_OUTPUT"
          echo "targets=$(jq -c 'map({key: .id, value: .}) | from_entries' bundle/targets.json)" >> "$GITHUB_OUTPUT"
    if: |-
      (github.event.action == 'release-tag-changed' &&
       startsWith(github.event.client_payload.ref, 'refs/tags/v') &&
       github.event.client_payload.deleted == false &&
       (github.event.client_payload.repository == 'SNodeC/snode.c' ||
        github.event.client_payload.repository == 'SNodeC/mqttsuite'))
  snodec_openwrt_24_10_x86_64:
    name: Build and publish snode.c · openwrt-24.10-x86_64
    needs:
      - prepare
    if: github.event.client_payload.repository == 'SNodeC/snode.c'
    runs-on: ${{ fromJSON(needs.prepare.outputs.targets)['openwrt-24.10-x86_64'].runner }}
    timeout-minutes: 360
    concurrency:
      group: package-build-${{ github.run_id }}-${{ fromJSON(needs.prepare.outputs.targets)['openwrt-24.10-x86_64'].build_slot }}
      cancel-in-progress: false
      queue: max
    env:
      BUILD_PROJECT: snode.c
      PACKAGE_RELEASE: ${{ fromJSON(needs.prepare.outputs.revisions)['snode.c'] }}
      TARGET_ID: openwrt-24.10-x86_64
      TARGET: ${{ toJSON(fromJSON(needs.prepare.outputs.targets)['openwrt-24.10-x86_64']) }}
    steps: &build_and_publish_steps
      - uses: actions/download-artifact@v8
        with:
          name: source-pair
          path: bundle
      - name: Unpack captured packaging tools
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          cp bundle/context.json bundle/release-context.json
          cp bundle/sources.json bundle/release-sources.json
      - uses: actions/create-github-app-token@v2
        id: badge_start
        with:
          app-id: ${{ vars.PACKAGES_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          token: ${{ steps.badge_start.outputs.token }}
          path: published
          sparse-checkout: |
            **/build.json
            /status.json
            /status/
            /docs/status.md
          sparse-checkout-cone-mode: false
      - name: Publish running badge
        run: bash feed/ci/publish/push.sh published "Build started" python3 -m ci.publish.publication status published bundle "$TARGET" running unused "$BUILD_PROJECT"
      - uses: actions/download-artifact@v8
        if: env.BUILD_PROJECT == 'mqttsuite' && env.RELEASE_PROJECT == 'snode.c'
        with:
          name: packages-snode.c-${{ fromJSON(env.TARGET).id }}
          path: published-snodec
      - name: Select captured dependencies
        run: |
          python3 -m ci.repository select bundle "$TARGET_ID" "$BUILD_PROJECT" published-snodec
          python3 -m ci.repository reuse bundle "$TARGET_ID" dependencies
      - uses: docker/setup-qemu-action@v4
        if: fromJSON(env.TARGET).family == 'linux' && contains(fromJSON('["armhf", "riscv64"]'), fromJSON(env.TARGET).arch)
        with:
          platforms: arm,riscv64
      - name: Build and test OpenWrt packages
        if: fromJSON(env.TARGET).family == 'openwrt'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(env.TARGET).build) }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd cmake qemu-user
          python3 -m ci.repository sdk "$MATRIX_ROW" sdk
          bash feed/ci/build/openwrt.sh feed bundle sdk
          python3 -m ci.repository stage sdk bundle output
      - name: Build and test Raspberry Pi OS packages
        if: fromJSON(env.TARGET).family == 'raspberrypi'
        env:
          SUITE: ${{ fromJSON(env.TARGET).suite }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          bash feed/ci/build/raspberrypi.sh "$SUITE"
      - name: Build and test Linux packages
        if: fromJSON(env.TARGET).family == 'linux'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(env.TARGET).build) }}
          APT_SIGNING_KEY: ${{ (fromJSON(env.TARGET).distribution == 'fedora' || fromJSON(env.TARGET).distribution == 'rocky') && secrets.APT_SIGNING_KEY || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg rpm createrepo-c
          bash feed/ci/build/linux.sh "$MATRIX_ROW"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.BUILD_PROJECT }}-${{ fromJSON(env.TARGET).id }}
          path: output/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ env.BUILD_PROJECT }}-${{ fromJSON(env.TARGET).id }}
          include-hidden-files: true
          overwrite: true
          path: |
            logs/
            sdk/logs/
            sdk/.config
            sdk/ci-sdk.json
      - uses: actions/create-github-app-token@v2
        if: ${{ always() && hashFiles('feed/ci/publish/push.sh') != '' }}
        id: badge_end
        with:
          app-id: ${{ vars.PACKAGES_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        if: ${{ always() && hashFiles('feed/ci/publish/push.sh') != '' }}
        with:
          repository: SNodeC/Packages
          ref: main
          token: ${{ steps.badge_end.outputs.token }}
          path: published
          sparse-checkout: |
            **/build.json
            /status.json
            /status/
            /docs/status.md
          sparse-checkout-cone-mode: false
      - name: Publish build result badge
        if: ${{ always() && hashFiles('feed/ci/publish/push.sh') != '' }}
        env:
          BADGE_STATUS: ${{ job.status == 'success' && 'built' || job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: bash feed/ci/publish/push.sh published "Build ended" python3 -m ci.publish.publication status published bundle "$TARGET" "$BADGE_STATUS" unused "$BUILD_PROJECT"
      - name: Select publication files
        id: scope
        run: |
          echo 'paths<<EOF' >> "$GITHUB_OUTPUT"
          python3 -m ci.publish.publication scope "$TARGET" >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          token: ${{ steps.badge_end.outputs.token }}
          path: published
          sparse-checkout: ${{ steps.scope.outputs.paths }}
          sparse-checkout-cone-mode: false
      - name: Publish publishing badge
        run: bash feed/ci/publish/push.sh published "Publication started" python3 -m ci.publish.publication status published bundle "$TARGET" publishing unused "$BUILD_PROJECT"
      - name: Install publication tools
        if: fromJSON(env.TARGET).family != 'openwrt'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg rpm
      - name: Publish packages and published badge
        env:
          APT_SIGNING_KEY: ${{ fromJSON(env.TARGET).family != 'openwrt' && secrets.APT_SIGNING_KEY || '' }}
        run: |
          cp bundle/release-context.json bundle/context.json
          cp bundle/release-sources.json bundle/sources.json
          bash feed/ci/publish/push.sh published "Update packages: $BUILD_PROJECT" python3 -m ci.publish.publication finish published bundle "$TARGET" success output "$BUILD_PROJECT"
      - name: Publish failed or cancelled badge
        if: ${{ (failure() || cancelled()) && steps.badge_end.outcome == 'success' && hashFiles('published/status.json') != '' }}
        env:
          BADGE_STATUS: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: bash feed/ci/publish/push.sh published "Job ended" python3 -m ci.publish.publication status published bundle "$TARGET" "$BADGE_STATUS" unused "$BUILD_PROJECT"
  mqttsuite_openwrt_24_10_x86_64:
    name: Build and publish mqttsuite · openwrt-24.10-x86_64
    needs:
      - prepare
      - snodec_openwrt_24_10_x86_64
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.snodec_openwrt_24_10_x86_64.result == 'success' || github.event.client_payload.repository == 'SNodeC/mqttsuite') }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.targets)['openwrt-24.10-x86_64'].runner }}
    timeout-minutes: 360
    concurrency:
      group: package-build-${{ github.run_id }}-${{ fromJSON(needs.prepare.outputs.targets)['openwrt-24.10-x86_64'].build_slot }}
      cancel-in-progress: false
      queue: max
    env:
