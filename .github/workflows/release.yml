name: Package release and publication
run-name: ${{ github.event.action == 'package-built' && format('Publish {0} · {1}', github.event.client_payload.project, github.event.client_payload.target) || format('Capture {0} · {1}', github.event.client_payload.repository, github.event.client_payload.ref) }}
on:
  repository_dispatch:
    types: [release-tag-changed, package-built]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: >-
      github.event.action == 'release-tag-changed' &&
      startsWith(github.event.client_payload.ref, 'refs/tags/v') &&
      github.event.client_payload.deleted == false &&
      (github.event.client_payload.repository == 'SNodeC/snode.c' ||
       github.event.client_payload.repository == 'SNodeC/mqttsuite')
    uses: ./.github/workflows/packages.yml
    with:
      release_project: ${{ github.event.client_payload.repository == 'SNodeC/snode.c' && 'snode.c' || 'mqttsuite' }}
      release_tag: ${{ github.event.client_payload.ref }}
    secrets: inherit
  publish:
    if: github.event.action == 'package-built'
    uses: ./.github/workflows/package-write.yml
    secrets: inherit
