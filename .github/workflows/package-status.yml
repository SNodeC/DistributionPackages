name: Refresh package status
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      attempt:
        required: true
        type: string
  workflow_run:
    workflows: [Distribution packages]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: package-status-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.attempt }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: publisher
        with:
          app-id: ${{ vars.PACKAGES_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          token: ${{ steps.publisher.outputs.token }}
          path: published
          sparse-checkout: |
            **/build.json
            /status.json
            /status/
            /docs/status.md
          sparse-checkout-cone-mode: false
      - name: Refresh this release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
        run: |
          previous=$(git -C published rev-parse HEAD)
          python3 -m ci.publish.publication refresh published "$RUN_ID" "$ATTEMPT"
          bash feed/ci/publish/push.sh published "$previous" "Refresh package status"
