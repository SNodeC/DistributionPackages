name: Coordinate package builds
on:
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry a repaired task: capture/project/target'
        type: string
      report:
        description: Verified source completion claim
        type: string
  workflow_run:
    workflows: [Orchestrate package release, Sign and publish distribution packages]
    types: [completed]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: read
concurrency:
  group: package-control
  cancel-in-progress: false
  queue: max
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: deployment
        run: PYTHONPATH=feed python3 -m ci.repository deployment >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v3
        id: coordinator
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: ${{ steps.deployment.outputs.owner }}
          repositories: ${{ steps.deployment.outputs.repositories }}
          permission-actions: write
          permission-contents: read
      - uses: actions/create-github-app-token@v3
        id: feed-write
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: ${{ steps.deployment.outputs.owner }}
          repositories: ${{ steps.deployment.outputs.feed_name }}
          permission-contents: write
      - name: Reconcile callbacks and admit ready targets
        env:
          PYTHONPATH: ${{ github.workspace }}/feed
          PACKAGE_COORDINATOR_REF: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          PACKAGES_TOKEN: ${{ steps.feed-write.outputs.token }}
          COORDINATOR_ACTOR: ${{ steps.coordinator.outputs.app-slug }}[bot]
          PACKAGE_RETRY: ${{ inputs.retry }}
          PACKAGE_REPORT: ${{ inputs.report }}
          OBSERVER_TOKEN: ${{ secrets.PACKAGES_OBSERVER_TOKEN }}
        run: python3 -m ci.dispatch control published
