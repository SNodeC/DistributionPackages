name: Reusable package build
on:
  workflow_call:
    secrets:
      PACKAGE_CAPTURE_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
  PACKAGE_REQUEST: ${{ github.event.inputs.request }}
  CAPTURE_RUN: ${{ fromJSON(github.event.inputs.request).capture }}
  BUILD_PROJECT: ${{ github.event.repository.name }}
  TARGET_ID: ${{ fromJSON(github.event.inputs.request).target }}
  PUBLISHED_REF: ${{ fromJSON(github.event.inputs.request).publication }}
jobs:
  build:
    name: ${{ fromJSON(github.event.inputs.request).target }}
    runs-on: ${{ fromJSON(github.event.inputs.request).runner == 'ubuntu-24.04-arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/DistributionPackages
          ref: main
          path: feed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: capture
        with:
          client-id: ${{ vars.PACKAGE_CAPTURE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGE_CAPTURE_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: DistributionPackages
          permission-actions: read
          permission-contents: read
      - uses: actions/download-artifact@v8
        with:
          repository: SNodeC/DistributionPackages
          run-id: ${{ env.CAPTURE_RUN }}
          github-token: ${{ steps.capture.outputs.token }}
          name: source-pair
          path: bundle
      - name: Authorize build permit
        id: permit
        env:
          GH_TOKEN: ${{ steps.capture.outputs.token }}
        run: |
          commit=$(jq -er '.recipe_commit | select(test("^[0-9a-f]{40}$"))' bundle/context.json)
          git -C feed merge-base --is-ancestor "$commit" HEAD
          git -C feed checkout --detach "$commit"
          python3 -m ci.dispatch authorize bundle
          echo "PACKAGE_RELEASE=$(jq -er --arg project "$BUILD_PROJECT" '.[$project]' bundle/revisions.json)" >> "$GITHUB_ENV"
      - name: Select captured dependencies
        run: |
          python3 -m ci.dispatch baseline bundle "$TARGET_ID" "$PUBLISHED_REF"
          python3 -m ci.repository select bundle "$TARGET_ID" "$BUILD_PROJECT" published-snodec
          python3 -m ci.repository reuse bundle "$TARGET_ID" dependencies
      - uses: docker/setup-qemu-action@v4
        if: fromJSON(steps.permit.outputs.row).family == 'linux' && contains(fromJSON('["armhf", "riscv64"]'), fromJSON(steps.permit.outputs.row).arch)
        with:
          platforms: arm,riscv64
      - name: Build and test OpenWrt packages
        if: fromJSON(steps.permit.outputs.row).family == 'openwrt'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(steps.permit.outputs.row).build) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd cmake qemu-user
          python3 -m ci.repository sdk "$MATRIX_ROW" sdk
          bash feed/ci/build/openwrt.sh feed bundle sdk
          python3 -m ci.repository stage sdk bundle output
      - name: Build and test Raspberry Pi OS packages
        if: fromJSON(steps.permit.outputs.row).family == 'raspberrypi'
        env:
          SUITE: ${{ fromJSON(steps.permit.outputs.row).suite }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          bash feed/ci/build/raspberrypi.sh "$SUITE"
      - name: Build and test Linux packages
        if: fromJSON(steps.permit.outputs.row).family == 'linux'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(steps.permit.outputs.row).build) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          bash feed/ci/build/linux.sh "$MATRIX_ROW"
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.BUILD_PROJECT }}-${{ env.TARGET_ID }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ env.BUILD_PROJECT }}-${{ env.TARGET_ID }}
          include-hidden-files: true
          overwrite: true
          path: |
            logs/
            sdk/logs/
            sdk/.config
            sdk/ci-sdk.json
