name: Render package status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    env:
      PYTHONPATH: ${{ github.workspace }}/feed
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/create-github-app-token@v3
        id: publisher
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - name: Render and commit recorded package status
        env:
          PACKAGES_TOKEN: ${{ steps.publisher.outputs.token }}
        run: bash feed/ci/publish/status.sh published render
