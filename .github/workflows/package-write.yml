name: Serialized package snapshot writer
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target:
        default: '{}'
        type: string
      result:
        type: string
      project:
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  write:
    name: ${{ inputs.operation == 'finish' && format('Publish {0} · {1}', inputs.project, fromJSON(inputs.target).id) || inputs.operation == 'status' && format('Mark {0} running · {1}', inputs.project, fromJSON(inputs.target).id) || 'Initialize package status' }}
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v8
        id: bundle
        with:
          name: source-pair
          path: bundle
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'finish' && inputs.result == 'success'
        with:
          name: packages-${{ inputs.project }}-${{ fromJSON(inputs.target).id }}
          path: incoming
      - name: Select the affected feed
        id: scope
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          echo 'paths<<EOF' >> "$GITHUB_OUTPUT"
          python3 -m ci.publish.publication scope "$TARGET" >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
      - name: Authenticate package publication
        uses: actions/create-github-app-token@v3
        id: publisher
        with:
          app-id: ${{ vars.PACKAGES_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          token: ${{ steps.publisher.outputs.token }}
          path: published
          sparse-checkout: ${{ steps.scope.outputs.paths }}
          sparse-checkout-cone-mode: false
      - name: Update the package snapshot
        id: write
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          RESULT: ${{ inputs.result }}
          BUILD_PROJECT: ${{ inputs.project }}
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ inputs.operation == 'finish' && inputs.result == 'success' && secrets.APT_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = finish ] && [ "$RESULT" = success ] && [ "$(jq -r .family <<< "$TARGET")" != openwrt ]; then
            sudo apt-get update
            sudo apt-get install -y apt-utils gnupg rpm
          fi
          previous=$(git -C published rev-parse HEAD)
          result=0
          python3 -m ci.publish.publication "$OPERATION" published bundle "$TARGET" "$RESULT" incoming "$BUILD_PROJECT" || result=$?
          bash feed/ci/publish/push.sh published "$previous" "Update packages: $OPERATION $BUILD_PROJECT"
          exit "$result"
