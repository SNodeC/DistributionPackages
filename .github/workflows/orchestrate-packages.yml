name: Orchestrate package release
run-name: Release · ${{ inputs.project }} · ${{ inputs.tag }} · ${{ inputs.run }}
on:
  workflow_dispatch:
    inputs:
      project:
        type: string
        required: true
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true
      run:
        type: string
        required: true
      definition:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: package-release-${{ inputs.project }}
  cancel-in-progress: false
  queue: max
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
          persist-credentials: false
      - name: Scope coordinator token to registered repositories
        id: repositories
        run: echo "names=$(jq -r '.repositories + ["DistributionPackages", "Packages"] | join(",")' feed/ci/projects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v3
        id: coordinator
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: ${{ steps.repositories.outputs.names }}
          permission-actions: read
          permission-contents: read
      - uses: actions/create-github-app-token@v3
        id: feed-write
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: SNodeC/Packages
          ref: main
          path: published
          token: ${{ steps.feed-write.outputs.token }}
          sparse-checkout: |
            **/build.json
            /status.json
          sparse-checkout-cone-mode: false
      - name: Validate source notification
        id: release
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
        run: python3 -m ci.dispatch intake
      - uses: actions/download-artifact@v8
        id: previous
        if: steps.release.outputs.duplicate != 'true' && github.run_attempt > 1
        continue-on-error: true
        with:
          name: source-pair
          path: bundle
      - name: Reserve revisions and capture immutable inputs
        if: steps.release.outputs.duplicate != 'true' && steps.previous.outcome != 'success'
        env:
          PACKAGES_TOKEN: ${{ steps.feed-write.outputs.token }}
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          RELEASE_PROJECT: ${{ steps.release.outputs.project }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_RUN: ${{ steps.release.outputs.run }}
          RELEASE_REQUESTED_AT: ${{ steps.release.outputs.requested_at }}
        run: |
          python3 -m ci.dispatch retry-capture
          rm -rf bundle
          bash feed/ci/publish/status.sh published reserve
          gh auth setup-git --hostname github.com
          python3 -m ci.repository prepare published bundle
      - name: Save immutable release capture
        uses: actions/upload-artifact@v7
        if: steps.release.outputs.duplicate != 'true' && steps.previous.outcome != 'success'
        with:
          name: source-pair
          path: bundle/
          if-no-files-found: error
      - name: Initialize graph status and schedule release builds
        if: steps.release.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          PACKAGES_TOKEN: ${{ steps.feed-write.outputs.token }}
        run: |
          python3 -m ci.repository check bundle
          bash feed/ci/publish/status.sh published status bundle '-' '-' pending
