name: Build and publish one project for one distribution target
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      project:
        required: true
        type: string
      release_project:
        required: true
        type: string
      revisions:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  build:
    name: Build and test ${{ inputs.project }} · ${{ fromJSON(inputs.target).id }}
    runs-on: ${{ fromJSON(inputs.target).runner }}
    timeout-minutes: 360
    concurrency:
      group: package-build-${{ github.run_id }}-${{ fromJSON(inputs.target).build_slot }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    env:
      PACKAGE_RELEASE: ${{ fromJSON(inputs.revisions)[inputs.project] }}
      BUILD_PROJECT: ${{ inputs.project }}
      TARGET_ID: ${{ fromJSON(inputs.target).id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-pair
          path: bundle
      - name: Unpack captured packaging tools
        run: |
          mkdir feed status-bundle
          tar -xzf bundle/feed.tar.gz -C feed
          cp bundle/*.json status-bundle/
      - uses: actions/create-github-app-token@v3
        id: running_status
        continue-on-error: true
        timeout-minutes: 1
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - name: Report build started
        continue-on-error: true
        timeout-minutes: 3
        env:
          PACKAGES_TOKEN: ${{ steps.running_status.outputs.token }}
          TARGET: ${{ inputs.target }}
        run: bash feed/ci/publish/status.sh published status status-bundle "$TARGET" "$BUILD_PROJECT" running
      - uses: actions/download-artifact@v8
        if: inputs.project == 'mqttsuite' && inputs.release_project == 'snode.c'
        with:
          name: packages-snode.c-${{ fromJSON(inputs.target).id }}
          path: published-snodec
      - name: Select captured dependencies
        run: |
          python3 -m ci.repository select bundle "$TARGET_ID" "$BUILD_PROJECT" published-snodec
          python3 -m ci.repository reuse bundle "$TARGET_ID" dependencies
      - uses: docker/setup-qemu-action@v4
        if: fromJSON(inputs.target).family == 'linux' && contains(fromJSON('["armhf", "riscv64"]'), fromJSON(inputs.target).arch)
        with:
          platforms: arm,riscv64
      - name: Build and test OpenWrt packages
        if: fromJSON(inputs.target).family == 'openwrt'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(inputs.target).build) }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd cmake qemu-user
          python3 -m ci.repository sdk "$MATRIX_ROW" sdk
          bash feed/ci/build/openwrt.sh feed bundle sdk
          python3 -m ci.repository stage sdk bundle output
      - name: Build and test Raspberry Pi OS packages
        if: fromJSON(inputs.target).family == 'raspberrypi'
        env:
          SUITE: ${{ fromJSON(inputs.target).suite }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          bash feed/ci/build/raspberrypi.sh "$SUITE"
      - name: Build and test Linux packages
        if: fromJSON(inputs.target).family == 'linux'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(inputs.target).build) }}
          APT_SIGNING_KEY: ${{ (fromJSON(inputs.target).distribution == 'fedora' || fromJSON(inputs.target).distribution == 'rocky') && secrets.APT_SIGNING_KEY || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg rpm createrepo-c
          bash feed/ci/build/linux.sh "$MATRIX_ROW"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ inputs.project }}-${{ fromJSON(inputs.target).id }}
          path: output/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ inputs.project }}-${{ fromJSON(inputs.target).id }}
          include-hidden-files: true
          overwrite: true
          path: |
            logs/
            sdk/logs/
            sdk/.config
            sdk/ci-sdk.json
      - uses: actions/create-github-app-token@v3
        if: ${{ always() }}
        id: ended_status
        continue-on-error: true
        timeout-minutes: 1
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - name: Report build ended
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PACKAGES_TOKEN: ${{ steps.ended_status.outputs.token }}
          TARGET: ${{ inputs.target }}
          BUILD_STATUS: ${{ job.status == 'success' && 'publishing' || job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: bash feed/ci/publish/status.sh published status status-bundle "$TARGET" "$BUILD_PROJECT" "$BUILD_STATUS"
  finish:
    name: Publish ${{ inputs.project }} · ${{ fromJSON(inputs.target).id }}
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: build
    uses: ./.github/workflows/package-write.yml
    with:
      project: ${{ inputs.project }}
      target: ${{ inputs.target }}
      result: ${{ needs.build.result }}
    secrets: inherit
