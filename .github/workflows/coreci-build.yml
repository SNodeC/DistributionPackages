name: coreci build
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      target:
        required: true
        type: string
      callback_url:
        required: false
        type: string
      source_repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      prerequisites:
        required: false
        type: string
      recipe_ref:
        required: false
        type: string
permissions:
  contents: read
  actions: read
  packages: read
env:
  INPUT_BUILD_ID: ${{ inputs.build_id }}
  INPUT_PACKAGE: ${{ inputs.package }}
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_REVISION: ${{ inputs.revision }}
  INPUT_TARGET: ${{ inputs.target }}
  INPUT_CALLBACK_URL: ${{ inputs.callback_url }}
  INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
  INPUT_TAG: ${{ inputs.tag }}
  INPUT_PREREQUISITES: ${{ inputs.prerequisites }}
  INPUT_RECIPE_REF: ${{ inputs.recipe_ref }}
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      recipe: ${{ steps.resolve.outputs.recipe }}
      source: ${{ steps.resolve.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/coreci-report
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
        with:
          callback_url: ${{ inputs.callback_url }}
          phase: build
          status: started
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m coreci.build resolve
  build:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.source }}
          ref: ${{ inputs.tag }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.source }}
          ref: ${{ needs.resolve.outputs.recipe }}
          path: recipe
          persist-credentials: false
      - name: Resolve SDK cache identity
        id: sdk
        run: python3 -m coreci.sdk
      - name: Cache SDK archive
        if: steps.sdk.outputs.archive != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.archive }}
          key: ${{ steps.sdk.outputs.key }}
      - name: Enable foreign architecture containers
        uses: docker/setup-qemu-action@v3
        if: steps.sdk.outputs.emulator != ''
        with:
          platforms: ${{ steps.sdk.outputs.emulator }}
      - name: Authenticate read-only image pulls
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build unsigned packages
        env:
          CORECI_SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m coreci.build run
      - uses: actions/upload-artifact@v4
        with:
          name: coreci-${{ inputs.build_id }}
          path: packages/
          if-no-files-found: error
          retention-days: 7
  report:
    needs: [resolve, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/coreci-report
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
        with:
          callback_url: ${{ inputs.callback_url }}
          phase: build
          status: ${{ needs.build.result == 'success' && 'succeeded' || 'failed' }}
          artifact: ${{ needs.build.result == 'success' && format('coreci-{0}', inputs.build_id) || '' }}
          reason: ${{ needs.build.result != 'success' && format('resolve={0}; build={1}', needs.resolve.result, needs.build.result) || '' }}
