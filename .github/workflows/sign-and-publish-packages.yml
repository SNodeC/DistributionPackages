name: Sign and publish distribution packages
# Sign and publish validated artifacts, then request any dependent target build.
run-name: Publish ${{ github.event.client_payload.project }} · ${{ github.event.client_payload.target }}
on:
  repository_dispatch:
    types: [sign-and-publish-packages, package-build-status]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
jobs:
  write:
    name: Publish ${{ github.event.client_payload.project }} · ${{ github.event.client_payload.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: publisher
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: SNodeC
          permission-contents: write
          permission-actions: read
      - name: Validate upstream build identity
        id: source
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: python3 -m ci.dispatch receive
      - uses: actions/download-artifact@v8
        with:
          repository: ${{ steps.source.outputs.capture_repository }}
          run-id: ${{ steps.source.outputs.capture }}
          github-token: ${{ steps.publisher.outputs.token }}
          name: source-pair
          path: bundle
      - name: Restore trusted publication tools and select feed
        id: scope
        env:
          TARGET: ${{ steps.source.outputs.target }}
          DOCS_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Execute only code from this repository's history, never an uploaded script.
          commit=$(jq -er '.recipe_commit | select(test("^[0-9a-f]{40}$"))' bundle/context.json)
          git -C feed merge-base --is-ancestor "$commit" HEAD
          # Publish current guides and downloadable installers; keep CI tooling capture-pinned.
          mkdir -p "$RUNNER_TEMP/package-site"
          git -C feed archive "origin/$DOCS_BRANCH" site install |
            tar -x -C "$RUNNER_TEMP/package-site"
          echo "PACKAGE_SITE=$RUNNER_TEMP/package-site/site" >> "$GITHUB_ENV"
          git -C feed checkout --detach "$commit"
          echo "signer-platform=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/package-site/site/README.md" feed/README.md
          rm -rf feed/docs feed/install
          cp -a "$RUNNER_TEMP/package-site/site/docs" feed/docs
          cp -a "$RUNNER_TEMP/package-site/install" feed/install
          echo 'paths<<EOF' >> "$GITHUB_OUTPUT"
          python3 -m ci.publish.publication scope "$TARGET" >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
      - name: Apply build status to the captured graph
        continue-on-error: ${{ github.event.action == 'sign-and-publish-packages' }}
        env:
          PACKAGES_TOKEN: ${{ steps.publisher.outputs.token }}
          TARGET: ${{ steps.source.outputs.target }}
          TARGET_ID: ${{ github.event.client_payload.target }}
          BUILD_PROJECT: ${{ steps.source.outputs.project }}
          BUILD_ATTEMPT: ${{ steps.source.outputs.attempt }}
          BUILD_RUN_URL: ${{ steps.source.outputs.run_url }}
          BUILD_STATUS: ${{ steps.source.outputs.status }}
        run: |
          if [ "$TARGET_ID" = '-' ]; then
            bash feed/ci/publish/status.sh published finalize bundle "$BUILD_STATUS"
          else
            bash feed/ci/publish/status.sh published status bundle "$TARGET" "$BUILD_PROJECT" "$BUILD_STATUS"
          fi
      - uses: actions/download-artifact@v8
        if: github.event.action == 'sign-and-publish-packages'
        with:
          repository: SNodeC/${{ steps.source.outputs.project }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ steps.publisher.outputs.token }}
          name: ${{ steps.source.outputs.artifact }}
          path: incoming
      - uses: actions/checkout@v6
        if: github.event.action == 'sign-and-publish-packages'
        with:
          repository: SNodeC/Packages
          ref: main
          token: ${{ steps.publisher.outputs.token }}
          path: published
          sparse-checkout: ${{ steps.scope.outputs.paths }}
          sparse-checkout-cone-mode: false
      - name: Cache compiled OpenWrt signers
        if: github.event.action == 'sign-and-publish-packages' && fromJSON(steps.source.outputs.target).family == 'openwrt'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openwrt-signers
          key: openwrt-signers-${{ runner.os }}-${{ runner.arch }}-${{ steps.scope.outputs.signer-platform }}-${{ hashFiles('feed/ci/publish/tools.sh') }}
      - name: Install signing tools
        if: github.event.action == 'sign-and-publish-packages'
        env:
          FAMILY: ${{ fromJSON(steps.source.outputs.target).family }}
        run: bash feed/ci/publish/tools.sh "$FAMILY" "$RUNNER_TEMP/openwrt-signers"
      - name: Sign and publish the package snapshot
        if: github.event.action == 'sign-and-publish-packages'
        id: write
        env:
          TARGET: ${{ steps.source.outputs.target }}
          BUILD_PROJECT: ${{ steps.source.outputs.project }}
          BUILD_ATTEMPT: ${{ steps.source.outputs.attempt }}
          BUILD_RUN_URL: ${{ steps.source.outputs.run_url }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          previous=$(git -C published rev-parse HEAD)
          result=0
          status=$(python3 -m ci.publish.publication feed published bundle "$TARGET" "$BUILD_PROJECT" incoming) || result=$?
          export EVENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) EVENT_STAGE=publication
          bash feed/ci/publish/push.sh published "$previous" "Update packages: $BUILD_PROJECT" \
            bash -c 'python3 -m ci.publish.publication status "$@" || echo "::warning::Publication status could not be rendered"' -- \
            published bundle "$TARGET" "$BUILD_PROJECT" "$status"
          exit "$result"
      - name: Dispatch dependent project after successful publication
        if: github.event.action == 'sign-and-publish-packages' && steps.write.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          TARGET_ID: ${{ github.event.client_payload.target }}
          PUBLICATION: ${{ steps.write.outputs.snapshot }}
        run: python3 -m ci.dispatch dependents bundle "$TARGET_ID" "$PUBLICATION" published
      - name: Report publication failure
        if: ${{ always() && github.event.action == 'sign-and-publish-packages' && steps.source.outcome == 'success' && steps.write.outcome != 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PACKAGES_TOKEN: ${{ steps.publisher.outputs.token }}
          TARGET: ${{ steps.source.outputs.target }}
          BUILD_PROJECT: ${{ steps.source.outputs.project }}
          BUILD_ATTEMPT: ${{ steps.source.outputs.attempt }}
          BUILD_RUN_URL: ${{ steps.source.outputs.run_url }}
          EVENT_STAGE: publication
          FINAL_STATUS: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: bash feed/ci/publish/status.sh failure-status status bundle "$TARGET" "$BUILD_PROJECT" "$FINAL_STATUS"
